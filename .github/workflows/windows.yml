name: windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci || npm install
      - name: Собрать www с переменными репозитория
        shell: bash
        env:
          LAUNCHER_APP: ${{ vars.LAUNCHER_APP || 'miniapphub.home' }}
          CATALOG_URL: ${{ vars.CATALOG_URL || 'https://miniapphub.github.io/catalog.json' }}
          PLATFORM: windows
        run: npm run build:www
      - name: Сборка установщиков
        run: npx tauri build
      - name: Разложить артефакты
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p dist-out
          cp src-tauri/target/release/bundle/msi/*.msi "dist-out/MiniAppHub-desktop-${V}.msi" 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist-out/MiniAppHub-desktop-${V}-setup.exe" 2>/dev/null || true
          ls -la dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: MiniAppHub-desktop
          path: dist-out/*
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          generate_release_notes: true
      - name: Сообщить порталу о новом релизе
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MiniAppHub/miniapphub.github.io/dispatches \
            -d '{"event_type":"shell-release","client_payload":{"repo":"appshell-desktop"}}'
